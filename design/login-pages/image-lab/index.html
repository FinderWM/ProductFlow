<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" />
    <title>Image Lab 登录页静态稿</title>
    <style>
      :root {
        --charcoal: #151612;
        --charcoal-soft: #202119;
        --paper: #eee7da;
        --paper-soft: #d9cfbd;
        --muted: #9c9487;
        --line: rgb(238 231 218 / 0.18);
        --line-strong: rgb(238 231 218 / 0.34);
        --accent: #8aa77e;
        --accent-soft: #c7d6a9;
        --danger: #d1866b;
        --shadow: 0 38px 120px rgb(0 0 0 / 0.36);
        --motion: cubic-bezier(0.32, 0.72, 0, 1);
        font-family:
          "Geist",
          "Satoshi",
          "Outfit",
          "Avenir Next",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          system-ui,
          sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html {
        min-height: 100%;
        background: var(--charcoal);
        color: var(--paper);
        letter-spacing: 0;
      }

      body {
        min-height: 100dvh;
        margin: 0;
        overflow-x: hidden;
        background:
          linear-gradient(112deg, #22251d 0 54%, #2b3228 54.2% 100%),
          linear-gradient(135deg, transparent 0 52%, rgb(168 187 139 / 0.22) 52.2% 66%, transparent 66.2%),
          #22251d;
      }

      body::before {
        position: fixed;
        inset: -20%;
        z-index: 0;
        pointer-events: none;
        content: "";
        background:
          radial-gradient(circle at 72% 38%, rgb(168 187 139 / 0.2), transparent 25rem),
          linear-gradient(124deg, transparent 0 42%, rgb(238 231 218 / 0.1) 42.2% 52%, transparent 52.2%);
        opacity: 0.76;
        transform: translate3d(0, 0, 0);
        animation: backgroundDrift 18s ease-in-out infinite alternate;
      }

      body::after {
        position: fixed;
        inset: 0;
        z-index: 8;
        pointer-events: none;
        content: "";
        opacity: 0.56;
        background: radial-gradient(circle at 76% 68%, rgb(238 231 218 / 0.11), transparent 22rem);
        transform: translate3d(0, 0, 0);
        animation: softPulse 10s var(--motion) infinite alternate;
      }

      button,
      input {
        font: inherit;
        letter-spacing: 0;
      }

      button {
        cursor: pointer;
      }

      .page {
        position: relative;
        display: grid;
        grid-template-columns: minmax(0, 1.14fr) minmax(420px, 0.86fr);
        gap: clamp(22px, 3.4vw, 56px);
        min-height: 100dvh;
        width: min(100%, 1500px);
        margin: 0 auto;
        padding: clamp(16px, 3vw, 40px);
      }

      .page::before {
        position: absolute;
        top: clamp(16px, 3vw, 40px);
        right: clamp(16px, 3vw, 40px);
        bottom: clamp(16px, 3vw, 40px);
        left: 56%;
        border: 0;
        border-radius: 46px;
        background:
          linear-gradient(128deg, transparent 0 48%, rgb(168 187 139 / 0.18) 48.2% 62%, transparent 62.2%),
          #293025;
        content: "";
        opacity: 0.76;
        transform: translate3d(0, 0, 0);
        animation: backgroundPanelFloat 14s var(--motion) infinite alternate;
      }

      .page::after {
        position: absolute;
        right: 34%;
        bottom: 0;
        width: 1px;
        height: 72vh;
        background: linear-gradient(180deg, transparent, rgb(238 231 218 / 0.24), transparent);
        content: "";
        transform: rotate(16deg);
      }

      .brand {
        position: fixed;
        top: clamp(18px, calc(1.2vw + 10px), 26px);
        left: 10px;
        z-index: 4;
        display: block;
        max-width: min(64vw, 940px);
        color: var(--paper);
        font-size: clamp(72px, 7.6vw, 122px);
        font-weight: 820;
        line-height: 0.88;
        opacity: 0.72;
        text-decoration: none;
        text-transform: none;
        white-space: nowrap;
        transform: scaleX(0.88);
        transform-origin: left top;
        pointer-events: auto;
      }

      .gallery {
        position: relative;
        z-index: 1;
        display: grid;
        min-height: calc(100dvh - clamp(32px, 6vw, 80px));
        padding-top: 58px;
      }

      .art-frame {
        position: relative;
        min-height: 610px;
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 36px;
        background: #202119;
        box-shadow: var(--shadow), inset 0 1px 0 rgb(255 255 255 / 0.08);
      }

      .art-frame img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: 58% center;
        opacity: 0.72;
        transform: scale(1.04);
      }

      .art-frame::before {
        position: absolute;
        inset: 0;
        z-index: 1;
        background:
          linear-gradient(90deg, rgb(21 22 18 / 0.88), transparent 42%),
          linear-gradient(180deg, transparent 42%, rgb(21 22 18 / 0.76));
        content: "";
      }

      .art-frame::after {
        position: absolute;
        inset: 22px;
        z-index: 2;
        border: 1px solid rgb(238 231 218 / 0.16);
        border-radius: 28px;
        content: "";
      }

      .caption {
        position: absolute;
        left: clamp(26px, 4vw, 54px);
        bottom: clamp(26px, 4vw, 54px);
        z-index: 3;
        display: grid;
        gap: 16px;
        max-width: 560px;
      }

      .caption code {
        width: fit-content;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 12px;
        background: rgb(21 22 18 / 0.44);
        color: var(--paper-soft);
        font-size: 12px;
        font-weight: 760;
      }

      .caption h1 {
        margin: 0;
        color: var(--paper);
        font-size: clamp(50px, 6vw, 92px);
        font-weight: 880;
        letter-spacing: 0;
        line-height: 0.82;
      }

      .caption p {
        max-width: 36ch;
        margin: 0;
        color: var(--paper-soft);
        font-size: 15px;
        line-height: 1.72;
      }

      .rail-text {
        position: absolute;
        top: 86px;
        right: 26px;
        z-index: 3;
        color: rgb(238 231 218 / 0.44);
        font-size: 12px;
        font-weight: 760;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        writing-mode: vertical-rl;
      }

      .login-panel {
        position: relative;
        z-index: 2;
        display: flex;
        min-height: calc(100dvh - clamp(32px, 6vw, 80px));
        flex-direction: column;
        align-items: flex-end;
        justify-content: center;
        gap: 12px;
        padding-top: 58px;
      }

      .entry-frame {
        position: relative;
        isolation: isolate;
        display: grid;
        width: min(100%, 508px);
        gap: 12px;
        padding: 10px 0 0 34px;
      }

      .entry-frame::before {
        position: absolute;
        inset: -34px -16px -38px -70px;
        z-index: 0;
        border: 1px solid rgb(238 231 218 / 0.18);
        border-radius: 40px;
        background:
          linear-gradient(125deg, rgb(238 231 218 / 0.08) 0 34%, transparent 34.4%),
          linear-gradient(145deg, transparent 0 62%, rgb(138 167 126 / 0.14) 62.4% 100%),
          rgb(37 42 33 / 0.82);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.08), 0 24px 78px rgb(0 0 0 / 0.24);
        content: "";
        transform: translate3d(0, 0, 0);
        animation: floatingKicker 13s var(--motion) infinite;
      }

      .entry-frame::after {
        position: absolute;
        inset: -17px 2px -18px -52px;
        z-index: 0;
        border: 1px solid rgb(199 214 169 / 0.1);
        border-radius: 32px;
        content: "";
        pointer-events: none;
        transform: translate3d(0, 0, 0);
        animation: floatingKicker 13s var(--motion) infinite;
      }

      .panel-kicker {
        position: relative;
        z-index: 2;
        display: grid;
        gap: 8px;
        width: min(100%, 316px);
        overflow: hidden;
        padding: 10px 2px 2px;
        transform: translate3d(0, 0, 0);
        animation: floatingKicker 13s var(--motion) infinite;
      }

      .panel-kicker::before {
        display: none;
      }

      .panel-kicker span {
        color: var(--accent-soft);
        font-size: 12px;
        font-weight: 800;
      }

      .panel-kicker h2 {
        max-width: 12ch;
        margin: 0;
        color: var(--paper);
        font-size: clamp(34px, 3.3vw, 52px);
        font-weight: 840;
        line-height: 0.96;
        word-break: keep-all;
      }

      .scan-card {
        position: relative;
        z-index: 3;
        justify-self: end;
        width: min(100%, 462px);
        overflow: hidden;
        border: 1px solid var(--line);
        border-radius: 28px;
        padding: 17px 17px 17px 44px;
        background:
          linear-gradient(145deg, rgb(238 231 218 / 0.12), rgb(238 231 218 / 0.045)),
          linear-gradient(118deg, transparent 0 56%, rgb(138 167 126 / 0.12) 56.2% 71%, transparent 71.2%),
          rgb(21 22 18 / 0.74);
        box-shadow: 0 22px 70px rgb(0 0 0 / 0.26), inset 0 1px 0 rgb(255 255 255 / 0.08);
      }

      .scan-card::before {
        position: absolute;
        top: -34%;
        right: -18%;
        width: 64%;
        aspect-ratio: 1;
        border-radius: 999px;
        background: conic-gradient(from 120deg, transparent, rgb(138 167 126 / 0.34), transparent 46%);
        content: "";
        opacity: 0.68;
        transform: rotate(22deg);
      }

      .scan-card::after {
        position: absolute;
        inset: 12px;
        border: 1px solid rgb(238 231 218 / 0.09);
        border-radius: 22px;
        content: "";
        pointer-events: none;
      }

      .scan-head,
      .scan-body,
      .mode-switch,
      form,
      .states {
        position: relative;
        z-index: 1;
      }

      .scan-head {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
        align-items: start;
        margin-bottom: 10px;
      }

      .scan-head span {
        color: var(--muted);
        font-size: 11px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .scan-head strong {
        display: block;
        margin-top: 5px;
        color: var(--paper);
        font-size: 16px;
        line-height: 1.16;
      }

      .scan-code {
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 8px 10px;
        color: var(--paper-soft);
        font-size: 11px;
        font-weight: 780;
      }

      .scan-body {
        display: grid;
        grid-template-columns: 104px 1fr;
        gap: 12px;
        align-items: center;
        margin-bottom: 9px;
      }

      .scanner {
        position: relative;
        display: grid;
        aspect-ratio: 1;
        place-items: center;
        overflow: hidden;
        border: 1px solid rgb(238 231 218 / 0.16);
        border-radius: 50%;
        background:
          linear-gradient(180deg, rgb(238 231 218 / 0.1), transparent),
          rgb(16 21 17 / 0.42);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.11), inset 0 -18px 34px rgb(0 0 0 / 0.22);
      }

      .scanner::before {
        position: absolute;
        inset: 9px;
        border-radius: inherit;
        background:
          conic-gradient(from 20deg, transparent, rgb(138 167 126 / 0.88), transparent 38%),
          linear-gradient(rgb(238 231 218 / 0.12), transparent);
        content: "";
        transform: rotate(28deg);
      }

      .scanner::after {
        position: absolute;
        inset: 20px;
        border: 1px solid rgb(238 231 218 / 0.2);
        border-radius: inherit;
        background: rgb(16 21 17 / 0.72);
        content: "";
      }

      .scanner-core {
        position: relative;
        z-index: 1;
        display: grid;
        width: 44px;
        height: 44px;
        place-items: center;
        border: 1px solid rgb(238 231 218 / 0.23);
        border-radius: 50%;
        background: rgb(238 231 218 / 0.08);
        color: var(--paper);
        font-size: 11px;
        font-weight: 860;
        text-transform: uppercase;
      }

      .scan-line {
        position: absolute;
        left: 16px;
        right: 16px;
        z-index: 2;
        height: 2px;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, rgb(199 214 169 / 0.9), transparent);
        opacity: 0.82;
        transform: translateY(0);
      }

      .meter {
        display: grid;
        gap: 7px;
      }

      .meter-row {
        display: grid;
        grid-template-columns: 38px 1fr auto;
        gap: 7px;
        align-items: center;
        color: var(--paper-soft);
        font-size: 11px;
        font-weight: 780;
      }

      .meter-row i {
        position: relative;
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: rgb(238 231 218 / 0.11);
      }

      .meter-row i::after {
        position: absolute;
        inset: 0;
        width: var(--meter);
        border-radius: inherit;
        background: linear-gradient(90deg, rgb(138 167 126 / 0.82), rgb(238 231 218 / 0.54));
        content: "";
        transform-origin: left center;
      }

      .mode-switch {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 6px;
        margin-bottom: 9px;
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 5px;
        background: rgb(238 231 218 / 0.055);
      }

      .mode-switch button {
        min-height: 35px;
        border: 0;
        border-radius: 999px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 760;
        transition:
          transform 240ms var(--motion),
          background 240ms var(--motion),
          color 240ms var(--motion);
      }

      .mode-switch .active {
        background: var(--paper);
        color: var(--charcoal);
      }

      .mode-switch button:active,
      .primary-button:active,
      .icon-button:active {
        transform: translateY(1px) scale(0.99);
      }

      form {
        display: grid;
        gap: 8px;
      }

      .field {
        display: grid;
        gap: 4px;
      }

      label {
        color: var(--paper);
        font-size: 13px;
        font-weight: 740;
      }

      .input-wrap {
        display: grid;
        grid-template-columns: 34px 1fr;
        gap: 10px;
        align-items: center;
        min-height: 42px;
        border: 1px solid var(--line-strong);
        border-radius: 17px;
        padding: 0 14px;
        background:
          linear-gradient(90deg, rgb(138 167 126 / 0.13), transparent 38%),
          rgb(238 231 218 / 0.08);
        box-shadow: inset 0 1px 0 rgb(255 255 255 / 0.06);
        transition:
          border-color 240ms var(--motion),
          box-shadow 240ms var(--motion),
          background 240ms var(--motion);
      }

      .input-wrap:focus-within {
        border-color: rgb(199 214 169 / 0.68);
        background: rgb(238 231 218 / 0.11);
        box-shadow: 0 0 0 4px rgb(138 167 126 / 0.15), inset 0 1px 0 rgb(255 255 255 / 0.08);
      }

      .input-index {
        display: grid;
        width: 30px;
        height: 30px;
        place-items: center;
        border: 1px solid rgb(238 231 218 / 0.16);
        border-radius: 11px;
        color: var(--accent-soft);
        font-size: 11px;
        font-weight: 860;
      }

      input {
        width: 100%;
        min-width: 0;
        border: 0;
        outline: none;
        background: transparent;
        color: var(--paper);
      }

      input::placeholder {
        color: rgb(156 148 135 / 0.78);
      }

      .helper {
        color: var(--muted);
        font-size: 10px;
        line-height: 1.25;
      }

      .error-message {
        display: grid;
        grid-template-columns: 10px 1fr;
        gap: 12px;
        align-items: start;
        border: 1px solid rgb(209 134 107 / 0.28);
        border-radius: 17px;
        padding: 8px 11px;
        background:
          linear-gradient(90deg, rgb(180 91 74 / 0.16), transparent 58%),
          rgb(238 231 218 / 0.045);
        color: var(--danger);
        font-size: 12px;
        font-weight: 700;
        line-height: 1.35;
      }

      .error-dot {
        width: 10px;
        height: 10px;
        margin-top: 3px;
        border-radius: 50%;
        background: var(--danger);
        box-shadow: 0 0 0 5px rgb(209 134 107 / 0.13);
      }

      .submit-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 12px;
      }

      .primary-button,
      .icon-button {
        min-height: 44px;
        border: 1px solid rgb(238 231 218 / 0.82);
        color: var(--charcoal);
        background: var(--paper);
        transition:
          transform 240ms var(--motion),
          background 240ms var(--motion),
          border-color 240ms var(--motion);
      }

      .primary-button {
        display: inline-flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        border-radius: 17px;
        padding: 0 16px 0 18px;
        font-weight: 820;
      }

      .primary-button:hover,
      .icon-button:hover {
        border-color: rgb(199 214 169 / 0.78);
        background: #f6eee1;
      }

      .primary-button svg,
      .icon-button svg {
        width: 18px;
        height: 18px;
      }

      .icon-button {
        display: grid;
        width: 44px;
        place-items: center;
        border-radius: 17px;
      }

      .states {
        display: grid;
        grid-template-columns: 1fr 1fr;
        width: min(100%, 420px);
        gap: 10px;
      }

      .state-card {
        min-height: 66px;
        border: 1px solid var(--line);
        border-radius: 19px;
        padding: 10px;
        background: rgb(238 231 218 / 0.055);
      }

      .state-card span {
        color: var(--muted);
        font-size: 10px;
        font-weight: 800;
        text-transform: uppercase;
      }

      .state-card strong {
        display: block;
        margin-top: 6px;
        color: var(--paper);
        font-size: 13px;
        line-height: 1.25;
      }

      .load-lines {
        display: grid;
        gap: 6px;
        margin-top: 8px;
      }

      .load-lines i {
        position: relative;
        overflow: hidden;
        height: 8px;
        border-radius: 999px;
        background: rgb(238 231 218 / 0.11);
      }

      .load-lines i::after {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, transparent, rgb(238 231 218 / 0.38), transparent);
        content: "";
        opacity: 0.48;
        transform: translateX(0);
      }

      .load-lines i:nth-child(2) {
        width: 64%;
      }

      @keyframes backgroundDrift {
        to {
          transform: translate3d(1.8%, -1.2%, 0);
        }
      }

      @keyframes backgroundPanelFloat {
        to {
          opacity: 0.88;
          transform: translate3d(-14px, 10px, 0);
        }
      }

      @keyframes softPulse {
        to {
          opacity: 0.26;
          transform: translate3d(-1.4%, 1%, 0) scale(1.03);
        }
      }

      @keyframes floatingKicker {
        0% {
          transform: translate3d(0, 0, 0) rotate(0deg);
        }

        22% {
          transform: translate3d(10px, -8px, 0) rotate(-0.4deg);
        }

        47% {
          transform: translate3d(-7px, 6px, 0) rotate(0.35deg);
        }

        73% {
          transform: translate3d(6px, 11px, 0) rotate(-0.2deg);
        }

        100% {
          transform: translate3d(-5px, -5px, 0) rotate(0.25deg);
        }
      }

      @keyframes rotateWash {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes scannerSpin {
        to {
          transform: rotate(360deg);
        }
      }

      @keyframes scanSweep {
        0%,
        100% {
          opacity: 0;
          transform: translateY(-44px);
        }

        14%,
        84% {
          opacity: 1;
        }

        50% {
          transform: translateY(44px);
        }
      }

      @keyframes meterPulse {
        to {
          transform: scaleX(0.84);
        }
      }

      @keyframes shimmer {
        to {
          transform: translateX(100%);
        }
      }

      @media (max-width: 1040px) {
        .page {
          grid-template-columns: 1fr;
          gap: 24px;
          padding: 18px;
        }

        .page::after {
          display: none;
        }

        .page::before {
          inset: 14px;
          left: 18%;
          border-radius: 32px;
        }

        .brand {
          position: fixed;
          top: 22px;
          left: 10px;
          max-width: calc(100% - 24px);
          font-size: clamp(56px, 9.4vw, 82px);
          transform: scaleX(0.88);
        }

        .gallery {
          min-height: auto;
          padding-top: 0;
        }

        .art-frame {
          min-height: 390px;
        }

        .login-panel {
          align-items: stretch;
          min-height: auto;
          padding-top: 0;
        }

        .entry-frame,
        .states {
          width: 100%;
        }

        .scan-card {
          width: min(100%, 462px);
        }

        .panel-kicker h2 {
          max-width: 12ch;
        }
      }

      @media (max-width: 640px) {
        .page {
          padding: 16px;
        }

        .page::before {
          inset: 10px;
          left: 8px;
          opacity: 0.54;
        }

        .brand {
          top: 18px;
          left: 10px;
          max-width: calc(100% - 20px);
          font-size: clamp(39px, 11.2vw, 47px);
          transform: scaleX(0.88);
        }

        .gallery {
          padding-top: 32px;
        }

        .art-frame {
          min-height: 250px;
          border-radius: 28px;
        }

        .caption {
          left: 20px;
          right: 20px;
          bottom: 20px;
          gap: 12px;
        }

        .caption h1 {
          max-width: 7ch;
          font-size: clamp(38px, 13vw, 56px);
        }

        .caption p,
        .rail-text {
          display: none;
        }

        .panel-kicker {
          width: min(100%, 290px);
          padding: 8px 0 0;
        }

        .entry-frame {
          padding-left: 0;
        }

        .panel-kicker h2 {
          max-width: 12ch;
          font-size: clamp(29px, 7.6vw, 34px);
        }

        .scan-card {
          justify-self: start;
          width: calc(100% - 16px);
          border-radius: 26px;
          padding: 16px 16px 16px 22px;
        }

        .scan-head,
        .scan-body {
          grid-template-columns: 1fr;
        }

        .scan-code {
          width: fit-content;
        }

        .scanner {
          width: min(100%, 188px);
          justify-self: center;
        }

        .meter-row {
          grid-template-columns: 42px 1fr 28px;
        }

        .submit-row,
        .states {
          grid-template-columns: 1fr;
        }

        .icon-button {
          display: none;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          scroll-behavior: auto !important;
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="page">
      <a class="brand" href="#" aria-label="Inspiration One">
        Inspiration One
      </a>

      <section class="gallery" aria-label="视觉概念">
        <article class="art-frame">
          <img src="../../../web/public/hero.png" alt="视觉创作海报" />
          <div class="rail-text">studio access</div>
          <div class="caption">
            <code>ACCESS / INVITATION ONLY</code>
            <h1>Enter the image lab</h1>
            <p>登录页像一张摄影棚邀请函，先给情绪和记忆点，再承载最短的进入路径。</p>
          </div>
        </article>
      </section>

      <section class="login-panel" aria-label="登录表单">
        <div class="entry-frame">
          <div class="panel-kicker">
            <span>PRIVATE ENTRY</span>
            <h2>验证身份，<br />进入创作现场</h2>
          </div>

          <section class="scan-card" aria-label="身份扫描登录模块">
            <div class="scan-head">
              <div>
                <span>identity scanner</span>
                <strong>身份信号校准完成</strong>
              </div>
              <div class="scan-code">IO-SCAN-9527</div>
            </div>

            <div class="scan-body">
              <div class="scanner" aria-hidden="true">
                <span class="scan-line"></span>
                <span class="scanner-core">Access</span>
              </div>

              <div class="meter" aria-label="校验状态">
                <div class="meter-row" style="--meter: 72%">
                  <span>KEY</span>
                  <i></i>
                  <b>72</b>
                </div>
                <div class="meter-row" style="--meter: 84%">
                  <span>PAIR</span>
                  <i></i>
                  <b>84</b>
                </div>
                <div class="meter-row" style="--meter: 63%">
                  <span>SYNC</span>
                  <i></i>
                  <b>63</b>
                </div>
              </div>
            </div>

            <div class="mode-switch" role="tablist" aria-label="登录模式">
              <button class="active" type="button" role="tab" aria-selected="true">登录</button>
              <button type="button" role="tab" aria-selected="false">设置密码</button>
            </div>

            <form>
              <div class="field">
                <label for="scan-fixed-username">账号</label>
                <div class="input-wrap">
                  <span class="input-index">01</span>
                  <input id="scan-fixed-username" type="text" placeholder="输入授权账号" autocomplete="username" />
                </div>
                <div class="helper">授权账号用于确认进入权限。</div>
              </div>

              <div class="field">
                <label for="scan-fixed-password">密码</label>
                <div class="input-wrap">
                  <span class="input-index">02</span>
                  <input id="scan-fixed-password" type="password" placeholder="输入当前密码" autocomplete="current-password" />
                </div>
                <div class="helper">首次进入或重置后可切换到设置密码。</div>
              </div>

              <div class="error-message" role="alert">
                <span class="error-dot" aria-hidden="true"></span>
                <span>身份信号未匹配，请检查账号或密码后重新校准。</span>
              </div>

              <div class="submit-row">
                <button class="primary-button" type="button">
                  确认进入
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M5 12h13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    <path
                      d="m13 6 6 6-6 6"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.8"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
                <button class="icon-button" type="button" aria-label="查看安全状态">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      d="M12 3.5 19 6v5.2c0 4.3-2.78 7.34-7 9.3-4.22-1.96-7-5-7-9.3V6l7-2.5Z"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linejoin="round"
                    />
                    <path
                      d="m9 12 2 2 4-4"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.7"
                      stroke-linecap="round"
                      stroke-linejoin="round"
                    />
                  </svg>
                </button>
              </div>
            </form>
          </section>
        </div>

        <div class="states" aria-label="状态示例">
          <div class="state-card">
            <span>loading</span>
            <strong>会话校验中</strong>
            <div class="load-lines" aria-hidden="true">
              <i></i>
              <i></i>
            </div>
          </div>
          <div class="state-card">
            <span>empty</span>
            <strong>设置密码后进入</strong>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
