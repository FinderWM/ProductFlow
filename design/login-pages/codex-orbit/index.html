<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" />
    <title>Inspiration One 登录页概念稿 C</title>
    <style>
      :root {
        color-scheme: dark;
        --void: #050505;
        --void-2: #090b0b;
        --ink: #f7efe2;
        --muted: #a9a095;
        --subtle: #6f756d;
        --line: rgba(247, 239, 226, 0.12);
        --line-strong: rgba(247, 239, 226, 0.22);
        --glass: rgba(247, 239, 226, 0.065);
        --glass-strong: rgba(247, 239, 226, 0.105);
        --emerald: #79d6bc;
        --amber: #edbd63;
        --rust: #c36b55;
        --lilac: #8f82df;
        --shadow: 0 34px 90px rgba(1, 9, 8, 0.32);
        --glow: 0 0 48px rgba(121, 214, 188, 0.16);
        --ease: cubic-bezier(0.32, 0.72, 0, 1);
        --cursor-x: 50vw;
        --cursor-y: 50vh;
        --orbit-x: 0px;
        --orbit-y: 0px;
        --auth-card-x: 0px;
        --auth-card-y: 0px;
        --auth-card-tilt: 0deg;
        --satellite-x: 0px;
        --satellite-y: 0px;
        --login-chip-x: 0px;
        --login-chip-y: 0px;
        --login-chip-tilt: 0deg;
        --setkey-chip-x: 0px;
        --setkey-chip-y: 0px;
        --setkey-chip-tilt: 0deg;
        --pointer-tilt: 0deg;
        --orbit-scale: 1;
        --orbit-glow: 0.22;
        font-family:
          "Clash Display",
          Geist,
          "Plus Jakarta Sans",
          "PingFang SC",
          "Hiragino Sans GB",
          "Microsoft YaHei",
          ui-sans-serif,
          sans-serif;
      }

      @property --orbit-scale {
        syntax: "<number>";
        inherits: true;
        initial-value: 1;
      }

      @property --orbit-glow {
        syntax: "<number>";
        inherits: true;
        initial-value: 0.22;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        overflow-x: hidden;
        background:
          linear-gradient(116deg, rgba(121, 214, 188, 0.13) 0 1px, transparent 1px 28%),
          linear-gradient(242deg, rgba(237, 189, 99, 0.12) 0 1px, transparent 1px 36%),
          linear-gradient(160deg, transparent 0 58%, rgba(143, 130, 223, 0.1) 58% 59%, transparent 59%),
          radial-gradient(circle at 50% 50%, #101616 0%, var(--void) 58%);
        color: var(--ink);
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        z-index: 20;
        pointer-events: none;
        opacity: 0.04;
        background-image:
          repeating-linear-gradient(0deg, rgba(255, 255, 255, 0.28) 0 1px, transparent 1px 3px),
          repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.14) 0 1px, transparent 1px 5px);
      }

      body::after {
        content: "";
        position: fixed;
        left: -18vw;
        top: -20vh;
        z-index: 0;
        width: 140vw;
        height: 140vh;
        pointer-events: none;
        opacity: 0.46;
        background:
          linear-gradient(118deg, transparent 0 36%, rgba(121, 214, 188, 0.18) 36% 37%, transparent 37%),
          linear-gradient(242deg, transparent 0 49%, rgba(237, 189, 99, 0.14) 49% 50%, transparent 50%),
          linear-gradient(168deg, transparent 0 62%, rgba(143, 130, 223, 0.12) 62% 63%, transparent 63%);
        transform: translate3d(-2vw, -2vh, 0) rotate(-2deg);
        animation: ambientDrift 16s var(--ease) infinite alternate;
      }

      button,
      input {
        font: inherit;
      }

      button {
        cursor: pointer;
      }

      .stage {
        position: relative;
        z-index: 1;
        width: min(1440px, calc(100% - 56px));
        min-height: 100dvh;
        margin: 0 auto;
        padding: 28px 0;
      }

      .pointer-glow {
        position: fixed;
        left: 0;
        top: 0;
        z-index: 0;
        width: 520px;
        height: 520px;
        pointer-events: none;
        border-radius: 999px;
        opacity: 0.42;
        background:
          radial-gradient(circle, rgba(121, 214, 188, 0.18), transparent 62%),
          radial-gradient(circle, rgba(237, 189, 99, 0.09), transparent 58%);
        transform: translate3d(calc(var(--cursor-x) - 260px), calc(var(--cursor-y) - 260px), 0);
        transition: opacity 900ms var(--ease);
      }

      .brand {
        position: absolute;
        left: 0;
        top: 34px;
        z-index: 3;
        display: inline-flex;
        align-items: center;
        animation: enter 980ms var(--ease) both;
      }

      .brand strong {
        display: block;
        font-size: 24px;
        line-height: 1;
        font-weight: 840;
      }

      .brand small {
        display: block;
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .vertical-title {
        position: absolute;
        right: -18px;
        top: 72px;
        z-index: 1;
        writing-mode: vertical-rl;
        color: rgba(247, 239, 226, 0.055);
        font-size: clamp(72px, 7vw, 120px);
        line-height: 0.82;
        font-weight: 840;
        letter-spacing: 0;
        pointer-events: none;
        animation: enter 1180ms var(--ease) 100ms both;
      }

      .orbit {
        position: absolute;
        left: 50%;
        top: 50%;
        width: min(880px, 62vw);
        aspect-ratio: 1;
        transform: translate(calc(-50% + var(--orbit-x)), calc(-50% + var(--orbit-y)))
          rotate(calc(-12deg + var(--pointer-tilt))) scale(var(--orbit-scale));
        border-radius: 50%;
        background:
          linear-gradient(128deg, rgb(121 214 188 / var(--orbit-glow)) 0 1px, transparent 1px 42%),
          linear-gradient(44deg, transparent 0 52%, rgb(237 189 99 / var(--orbit-glow)) 52% 53%, transparent 53%);
        box-shadow:
          inset 0 0 0 1px rgb(247 239 226 / calc(var(--orbit-glow) * 0.52)),
          inset 0 0 0 28px rgb(247 239 226 / calc(var(--orbit-glow) * 0.08)),
          0 34px 90px rgba(1, 9, 8, 0.32),
          0 0 62px rgb(121 214 188 / calc(var(--orbit-glow) * 0.36));
        animation: orbitIn 1120ms var(--ease) 80ms both, orbitHeartbeat 3.2s var(--ease) 1300ms infinite;
      }

      .orbit::before,
      .orbit::after {
        content: "";
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
        transform-origin: center;
      }

      .orbit::before {
        inset: 72px;
        opacity: 0.72;
        box-shadow: inset 0 0 0 1px rgba(247, 239, 226, 0.09), 0 0 52px rgba(121, 214, 188, 0.07);
      }

      .orbit::after {
        inset: 180px;
        opacity: 0.82;
        background: rgba(5, 5, 5, 0.38);
        box-shadow: inset 0 0 0 1px rgba(247, 239, 226, 0.07);
      }

      .headline {
        position: absolute;
        left: 7%;
        top: 23%;
        z-index: 4;
        width: min(460px, 34vw);
        animation: enter 980ms var(--ease) 160ms both;
      }

      .eyebrow {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--amber);
        font-size: 12px;
        font-weight: 800;
      }

      .eyebrow::before {
        content: "";
        width: 30px;
        height: 2px;
        border-radius: 999px;
        background: var(--amber);
      }

      h1 {
        max-width: 460px;
        margin: 22px 0 0;
        font-size: clamp(52px, 5.2vw, 82px);
        line-height: 0.94;
        font-weight: 840;
        letter-spacing: 0;
      }

      .headline p {
        max-width: 430px;
        margin: 26px 0 0;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.78;
      }

      .mode-input {
        position: fixed;
        width: 1px;
        height: 1px;
        opacity: 0;
        pointer-events: none;
      }

      .auth-shell {
        position: absolute;
        left: 58%;
        top: 52%;
        z-index: 6;
        width: min(520px, 38vw);
        padding: 8px;
        border-radius: 48px;
        background: var(--glass-strong);
        box-shadow: inset 0 1px 0 rgba(247, 239, 226, 0.12), var(--shadow), var(--glow);
        transform: translate(calc(-50% + var(--auth-card-x)), calc(-50% + var(--auth-card-y)))
          rotate(calc(7deg + var(--auth-card-tilt)));
        animation: cardIn 1120ms var(--ease) 240ms both;
      }

      .auth-core {
        min-height: 560px;
        overflow: hidden;
        border: 1px solid rgba(247, 239, 226, 0.13);
        border-radius: 40px;
        background:
          linear-gradient(132deg, rgba(121, 214, 188, 0.12) 0 1px, transparent 1px 48%),
          linear-gradient(34deg, transparent 0 56%, rgba(195, 107, 85, 0.12) 56% 57%, transparent 57%),
          #080a09;
        box-shadow: inset 0 1px 1px rgba(247, 239, 226, 0.1);
        transform: rotate(-7deg);
      }

      .auth-head {
        padding: 32px 32px 0;
      }

      .access-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
      }

      .access-label {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        color: var(--emerald);
        font-size: 11px;
        font-weight: 820;
      }

      .access-label::before {
        content: "";
        width: 9px;
        height: 9px;
        border-radius: 3px;
        background: var(--emerald);
        transform: rotate(45deg);
      }

      .console-index {
        display: inline-flex;
        align-items: baseline;
        gap: 4px;
        color: rgba(247, 239, 226, 0.32);
        font-weight: 820;
      }

      .console-index strong {
        color: var(--ink);
        font-size: 30px;
      }

      .auth-head h2 {
        margin: 36px 0 0;
        font-size: 42px;
        line-height: 1;
        font-weight: 900;
        letter-spacing: 0;
      }

      .auth-head p {
        margin: 12px 0 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.65;
      }

      .switch-shell {
        margin: 30px 32px 0;
        padding: 5px;
        border-radius: 999px;
        background: rgba(247, 239, 226, 0.065);
        box-shadow: inset 0 1px 0 rgba(247, 239, 226, 0.1);
      }

      .switch-core {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 5px;
      }

      .switch-core label {
        display: grid;
        min-height: 44px;
        place-items: center;
        border-radius: 999px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 780;
        transition:
          transform 720ms var(--ease),
          background 720ms var(--ease),
          color 720ms var(--ease),
          box-shadow 720ms var(--ease);
      }

      .switch-core label:hover {
        transform: translateY(-1px);
        color: var(--ink);
      }

      #mode-login:checked ~ .auth-shell label[for="mode-login"],
      #mode-setup:checked ~ .auth-shell label[for="mode-setup"] {
        background: var(--ink);
        color: var(--void);
        box-shadow: 0 16px 34px rgba(1, 9, 8, 0.26), inset 0 1px 0 rgba(255, 255, 255, 0.24);
      }

      .form {
        display: grid;
        gap: 14px;
        padding: 24px 32px 32px;
      }

      .field {
        display: grid;
        grid-template-columns: 96px minmax(0, 1fr);
        gap: 12px;
        align-items: center;
      }

      .field label {
        color: var(--muted);
        font-size: 12px;
        font-weight: 780;
      }

      .field-shell {
        min-width: 0;
        padding: 5px;
        border-radius: 999px;
        background: rgba(247, 239, 226, 0.065);
        box-shadow: inset 0 1px 0 rgba(247, 239, 226, 0.1);
        transition:
          transform 720ms var(--ease),
          background 720ms var(--ease),
          box-shadow 720ms var(--ease);
      }

      .field-shell:focus-within {
        transform: translateX(4px);
        background: rgba(121, 214, 188, 0.14);
        box-shadow: 0 16px 40px rgba(121, 214, 188, 0.1), inset 0 1px 0 rgba(247, 239, 226, 0.12);
      }

      .field-core {
        width: 100%;
        min-height: 50px;
        border: 0;
        border-radius: 999px;
        outline: 0;
        background: rgba(5, 5, 5, 0.58);
        color: var(--ink);
        padding: 0 16px;
        font-size: 14px;
        box-shadow: inset 0 1px 1px rgba(247, 239, 226, 0.08);
      }

      .field-core::placeholder {
        color: rgba(169, 160, 149, 0.68);
      }

      .setup-only {
        display: none;
      }

      #mode-setup:checked ~ .auth-shell .setup-only {
        display: grid;
        animation: enter 760ms var(--ease) both;
      }

      .notice {
        display: flex;
        min-height: 42px;
        align-items: center;
        gap: 10px;
        border-radius: 20px;
        padding: 0 14px;
        background: rgba(195, 107, 85, 0.12);
        color: #e7a191;
        font-size: 12px;
        font-weight: 720;
      }

      .notice::before {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: var(--rust);
      }

      .primary {
        display: flex;
        width: 100%;
        min-height: 58px;
        align-items: center;
        justify-content: space-between;
        gap: 18px;
        border: 0;
        border-radius: 999px;
        background: var(--ink);
        color: var(--void);
        padding: 9px 9px 9px 24px;
        box-shadow: 0 24px 54px rgba(1, 9, 8, 0.3), 0 0 44px rgba(237, 189, 99, 0.13);
        font-size: 14px;
        font-weight: 820;
        transition:
          transform 720ms var(--ease),
          background 720ms var(--ease),
          box-shadow 720ms var(--ease);
      }

      .primary:hover {
        transform: translateY(-2px) rotate(-1deg);
        background: #fff5df;
        box-shadow: 0 30px 68px rgba(1, 9, 8, 0.34), 0 0 58px rgba(237, 189, 99, 0.19);
      }

      .primary:active {
        transform: scale(0.985);
      }

      .primary span:last-child {
        display: grid;
        width: 40px;
        height: 40px;
        place-items: center;
        border-radius: 999px;
        background: rgba(5, 5, 5, 0.12);
        transition:
          transform 720ms var(--ease),
          background 720ms var(--ease);
      }

      .primary:hover span:last-child {
        transform: translate(4px, -1px) scale(1.06);
        background: rgba(5, 5, 5, 0.16);
      }

      .satellite {
        position: absolute;
        z-index: 5;
        padding: 7px;
        border-radius: 30px;
        background: var(--glass);
        box-shadow: inset 0 1px 0 rgba(247, 239, 226, 0.11), var(--shadow);
        animation: enter 1040ms var(--ease) both;
      }

      .satellite-inner {
        min-height: 100%;
        border: 1px solid rgba(247, 239, 226, 0.11);
        border-radius: 23px;
        background: var(--void-2);
        box-shadow: inset 0 1px 1px rgba(247, 239, 226, 0.08);
      }

      .satellite-a {
        left: 56%;
        top: 16%;
        width: 250px;
        transform: translate3d(var(--satellite-x), var(--satellite-y), 0) rotate(-7deg);
        animation-delay: 320ms;
      }

      .satellite-a .satellite-inner {
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        gap: 8px;
        padding: 18px;
      }

      .satellite-a span {
        min-height: 38px;
        border-radius: 13px;
        background: rgba(247, 239, 226, 0.06);
      }

      .satellite-a span:nth-child(3n) {
        background: rgba(121, 214, 188, 0.24);
      }

      .satellite-a span:nth-child(7n) {
        background: rgba(237, 189, 99, 0.22);
      }

      .satellite-b {
        right: 7%;
        bottom: 12%;
        width: 260px;
        transform: translate3d(calc(var(--satellite-x) * -1), calc(var(--satellite-y) * -1), 0) rotate(5deg);
        animation-delay: 400ms;
      }

      .satellite-b .satellite-inner {
        padding: 24px;
        background:
          linear-gradient(128deg, rgba(195, 107, 85, 0.16) 0 1px, transparent 1px 58%),
          #120d0b;
      }

      .satellite-b small {
        display: block;
        color: var(--rust);
        font-size: 11px;
        font-weight: 820;
      }

      .satellite-b strong {
        display: block;
        margin-top: 20px;
        font-size: 38px;
        line-height: 0.9;
        font-weight: 840;
      }

      .mode-rail {
        position: absolute;
        left: calc(58% - 390px);
        top: calc(52% + 170px);
        z-index: 7;
        display: grid;
        gap: 9px;
        transform: translate3d(0, 0, 0);
        animation: railEnter 980ms var(--ease) 460ms both;
      }

      .rail-chip {
        display: inline-flex;
        min-width: 120px;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        border-radius: 999px;
        padding: 10px 12px;
        background: rgba(247, 239, 226, 0.075);
        color: var(--muted);
        box-shadow: inset 0 1px 0 rgba(247, 239, 226, 0.11);
        font-size: 12px;
        font-weight: 780;
        transition: transform 760ms var(--ease);
      }

      .rail-chip::after {
        content: "";
        width: 8px;
        height: 8px;
        border-radius: 999px;
        background: currentColor;
      }

      .rail-chip.active {
        background: var(--ink);
        color: var(--void);
      }

      .rail-chip-login {
        transform: translate3d(var(--login-chip-x), var(--login-chip-y), 0) rotate(var(--login-chip-tilt));
      }

      .rail-chip-setkey {
        transform: translate3d(var(--setkey-chip-x), var(--setkey-chip-y), 0) rotate(var(--setkey-chip-tilt));
      }

      .rail-chip-login:hover {
        transform: translate3d(calc(var(--login-chip-x) + 4px), calc(var(--login-chip-y) - 2px), 0)
          rotate(calc(var(--login-chip-tilt) - 1deg));
      }

      .rail-chip-setkey:hover {
        transform: translate3d(calc(var(--setkey-chip-x) - 3px), calc(var(--setkey-chip-y) + 2px), 0)
          rotate(calc(var(--setkey-chip-tilt) + 1deg));
      }

      @keyframes enter {
        from {
          opacity: 0;
          transform: translateY(34px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes ambientDrift {
        from {
          opacity: 0.34;
          transform: translate3d(-2vw, -2vh, 0) rotate(-2deg);
        }
        to {
          opacity: 0.56;
          transform: translate3d(3vw, 4vh, 0) rotate(2deg);
        }
      }

      @keyframes orbitIn {
        from {
          opacity: 0;
          transform: translate(calc(-50% + var(--orbit-x)), calc(-50% + var(--orbit-y)))
            rotate(calc(-12deg + var(--pointer-tilt))) scale(0.88);
        }
        to {
          opacity: 1;
          transform: translate(calc(-50% + var(--orbit-x)), calc(-50% + var(--orbit-y)))
            rotate(calc(-12deg + var(--pointer-tilt))) scale(var(--orbit-scale));
        }
      }

      @keyframes cardIn {
        from {
          opacity: 0;
          transform: translate(calc(-50% + var(--auth-card-x)), calc(-50% + var(--auth-card-y)))
            rotate(calc(7deg + var(--auth-card-tilt))) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translate(calc(-50% + var(--auth-card-x)), calc(-50% + var(--auth-card-y)))
            rotate(calc(7deg + var(--auth-card-tilt))) scale(1);
        }
      }

      @keyframes railEnter {
        from {
          opacity: 0;
          transform: translate3d(0, 34px, 0);
        }
        to {
          opacity: 1;
          transform: translate3d(0, 0, 0);
        }
      }

      @keyframes orbitHeartbeat {
        0%,
        100% {
          --orbit-scale: 1;
          --orbit-glow: 0.16;
          opacity: 0.82;
        }
        12% {
          --orbit-scale: 1.026;
          --orbit-glow: 0.31;
          opacity: 0.96;
        }
        22% {
          --orbit-scale: 0.992;
          --orbit-glow: 0.2;
          opacity: 0.86;
        }
        36% {
          --orbit-scale: 1.014;
          --orbit-glow: 0.26;
          opacity: 0.92;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 1ms !important;
          animation-iteration-count: 1 !important;
          transition-duration: 1ms !important;
        }

        body::after {
          animation: none !important;
          opacity: 0.48;
        }

        .pointer-glow {
          animation: none !important;
        }
      }

      @media (max-width: 1180px) {
        .stage {
          width: min(840px, calc(100% - 40px));
          padding: 28px 0 56px;
        }

        .brand,
        .vertical-title,
        .orbit,
        .headline,
        .auth-shell,
        .satellite,
        .mode-rail {
          position: relative;
          left: auto;
          right: auto;
          top: auto;
          bottom: auto;
          transform: none;
        }

        .stage {
          display: grid;
          gap: 22px;
        }

        .vertical-title {
          display: none;
        }

        .orbit {
          animation: enter 980ms var(--ease) both;
          order: 2;
          justify-self: center;
          width: min(620px, 86vw);
          margin: 18px 0 -240px;
          opacity: 0.38;
          transform: none;
        }

        .headline {
          order: 3;
          width: min(620px, 100%);
          padding-top: 12px;
        }

        h1 {
          max-width: 620px;
          font-size: 58px;
        }

        .auth-shell {
          animation: enter 980ms var(--ease) both;
          order: 4;
          justify-self: stretch;
          width: 100%;
          transform: none;
        }

        .auth-core {
          transform: none;
        }

        .satellite-a,
        .satellite-b {
          display: none;
        }

        .mode-rail {
          order: 5;
          grid-template-columns: repeat(2, max-content);
        }
      }

      @media (max-width: 760px) {
        .stage {
          width: 100%;
          padding: 22px 16px 40px;
        }

        .brand {
          order: 1;
        }

        .orbit {
          width: 420px;
          margin: 6px auto -230px;
        }

        .headline {
          padding-top: 0;
        }

        h1 {
          max-width: 340px;
          font-size: 40px;
          line-height: 1.04;
        }

        .headline p {
          max-width: 330px;
          font-size: 15px;
        }

        .auth-head,
        .form {
          padding-right: 22px;
          padding-left: 22px;
        }

        .switch-shell {
          margin-right: 22px;
          margin-left: 22px;
        }

        .auth-core {
          min-height: auto;
        }

        .auth-head h2 {
          font-size: 34px;
        }

        .access-row {
          align-items: flex-start;
          flex-direction: column;
          gap: 8px;
        }

        .console-index {
          font-size: 11px;
        }

        .console-index strong {
          font-size: 22px;
        }

        .field {
          grid-template-columns: 1fr;
          gap: 7px;
        }

        .field-shell:focus-within {
          transform: translateY(-1px);
        }

        .mode-rail {
          grid-template-columns: 1fr 1fr;
        }

        .rail-chip {
          min-width: 0;
        }
      }
    </style>
  </head>
  <body>
    <div class="pointer-glow" aria-hidden="true"></div>
    <main class="stage">
      <div class="brand">
        <div>
          <strong>Inspiration One</strong>
          <small>Orbital access concept</small>
        </div>
      </div>

      <div class="vertical-title" aria-hidden="true">ACCESS<br />ORBIT</div>
      <div class="orbit" aria-hidden="true"></div>

      <section class="headline" aria-label="概念说明">
        <span class="eyebrow">ORBITAL LOGIN</span>
        <h1>进入你的创意工作台</h1>
        <p>从灵感编排、图像会话到素材沉淀，Inspiration One 将创作链路收束成一座私有控制台。</p>
      </section>

      <input class="mode-input" type="radio" name="mode" id="mode-login" checked />
      <input class="mode-input" type="radio" name="mode" id="mode-setup" />

      <section class="auth-shell" aria-label="登录表单静态稿 C">
        <div class="auth-core">
          <div class="auth-head">
            <div class="access-row">
              <span class="access-label">CORE ACCESS</span>
              <span class="console-index">No.<strong>9527</strong></span>
            </div>
            <h2>INSPIRATION START</h2>
            <p>使用账号密码进入私有创意空间。</p>
          </div>

          <div class="switch-shell">
            <div class="switch-core" role="tablist" aria-label="登录模式">
              <label for="mode-login">登录</label>
              <label for="mode-setup">设置密码</label>
            </div>
          </div>

          <form class="form">
            <div class="field">
              <label for="username">账号</label>
              <div class="field-shell">
                <input class="field-core" id="username" type="text" placeholder="请输入账号" autocomplete="username" />
              </div>
            </div>

            <div class="field">
              <label for="password">密码</label>
              <div class="field-shell">
                <input
                  class="field-core"
                  id="password"
                  type="password"
                  placeholder="请输入密码"
                  autocomplete="current-password"
                />
              </div>
            </div>

            <div class="field setup-only">
              <label for="setup-token">设密凭据</label>
              <div class="field-shell">
                <input
                  class="field-core"
                  id="setup-token"
                  type="password"
                  placeholder="输入管理员提供的一次性凭据"
                  autocomplete="one-time-code"
                />
              </div>
            </div>

            <div class="field setup-only">
              <label for="confirm-password">确认密码</label>
              <div class="field-shell">
                <input
                  class="field-core"
                  id="confirm-password"
                  type="password"
                  placeholder="再次输入密码"
                  autocomplete="new-password"
                />
              </div>
            </div>

            <div class="notice">错误状态示例：请填写账号和密码。</div>

            <button class="primary" type="button">
              <span>进入工作台</span>
              <span aria-hidden="true">↗</span>
            </button>
          </form>
        </div>
      </section>

      <div class="satellite satellite-a" aria-hidden="true">
        <div class="satellite-inner">
          <span></span><span></span><span></span><span></span><span></span>
          <span></span><span></span><span></span><span></span><span></span>
        </div>
      </div>

      <div class="satellite satellite-b" aria-hidden="true">
        <div class="satellite-inner">
          <small>CONTROL SURFACE</small>
          <strong>Creative<br />command orbit</strong>
        </div>
      </div>

      <div class="mode-rail" aria-hidden="true">
        <span class="rail-chip rail-chip-login active">Login</span>
        <span class="rail-chip rail-chip-setkey">Set key</span>
      </div>
    </main>
    <script>
      (() => {
        const root = document.documentElement;
        const canTrackPointer = window.matchMedia("(pointer: fine)").matches;
        const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

        if (!canTrackPointer || reduceMotion) {
          return;
        }

        let raf = 0;
        let nextX = 0;
        let nextY = 0;

        const setMotionVars = () => {
          raf = 0;
          root.style.setProperty("--cursor-x", `${window.innerWidth * (nextX + 1) * 0.5}px`);
          root.style.setProperty("--cursor-y", `${window.innerHeight * (nextY + 1) * 0.5}px`);
          root.style.setProperty("--orbit-x", `${nextX * 18}px`);
          root.style.setProperty("--orbit-y", `${nextY * 14}px`);
          root.style.setProperty("--auth-card-x", `${nextX * -8}px`);
          root.style.setProperty("--auth-card-y", `${nextY * -6}px`);
          root.style.setProperty("--auth-card-tilt", `${nextX * -0.8}deg`);
          root.style.setProperty("--satellite-x", `${nextX * 14}px`);
          root.style.setProperty("--satellite-y", `${nextY * 10}px`);
          root.style.setProperty("--login-chip-x", `${nextX * 13}px`);
          root.style.setProperty("--login-chip-y", `${nextY * -7}px`);
          root.style.setProperty("--login-chip-tilt", `${nextX * -1.4}deg`);
          root.style.setProperty("--setkey-chip-x", `${nextX * -9}px`);
          root.style.setProperty("--setkey-chip-y", `${nextY * 9}px`);
          root.style.setProperty("--setkey-chip-tilt", `${nextX * 1.1}deg`);
          root.style.setProperty("--pointer-tilt", `${nextX * 1.4}deg`);
        };

        const requestMotionFrame = () => {
          if (raf) {
            return;
          }
          raf = window.requestAnimationFrame(setMotionVars);
        };

        window.addEventListener(
          "pointermove",
          (event) => {
            nextX = (event.clientX / window.innerWidth - 0.5) * 2;
            nextY = (event.clientY / window.innerHeight - 0.5) * 2;
            requestMotionFrame();
          },
          { passive: true },
        );

        document.addEventListener(
          "mouseleave",
          () => {
            nextX = 0;
            nextY = 0;
            requestMotionFrame();
          },
          { passive: true },
        );
      })();
    </script>
  </body>
</html>
